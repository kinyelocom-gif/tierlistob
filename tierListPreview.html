
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наши хотелки</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="header">
        <h1>Наши хотелки</h1>
        <p>Общий спbсок желаний и покупок</p>
    </header>

    <main class="main">
        <section class="tier-list" id="tier-list">
            <div class="tier-row">
                <div class="tier-label rank-s">S</div>
                <div class="tier-items" data-rank="S"></div>
            </div>

            <div class="tier-row">
                <div class="tier-label rank-a">A</div>
                <div class="tier-items" data-rank="A"></div>
            </div>

            <div class="tier-row">
                <div class="tier-label rank-b">B</div>
                <div class="tier-items" data-rank="B"></div>
            </div>

            <div class="tier-row">
                <div class="tier-label rank-c">C</div>
                <div class="tier-items" data-rank="C"></div>
            </div>

            <div class="tier-row">
                <div class="tier-label rank-d">D</div>
                <div class="tier-items" data-rank="D"></div>
            </div>
        </section>

        <button id="add-item">Добавить хотелку</button>
    </main>
</body>
</html>
